name: Build Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK command-line tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y wget unzip
          mkdir -p $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-extract
          mv /tmp/cmdline-tools-extract/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Accept licenses and install SDK packages
        run: |
          yes | sdkmanager --sdk_root=$HOME/android-sdk --licenses > /dev/null 2>&1 || true
          sdkmanager --sdk_root=$HOME/android-sdk "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > /tmp/upload-keystore.jks

      - name: Create Bubblewrap config
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\": \"$JAVA_HOME\", \"androidSdkPath\": \"$HOME/android-sdk\"}" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json

      - name: Create twa-manifest.json
        run: |
          cat > twa-manifest.json << 'EOF'
          {
            "packageId": "io.github.jaysolo828_jpg.twa",
            "host": "app.therapyandsneakers.org",
            "name": "T&S Muscle",
            "launcherName": "T&S Muscle",
            "display": "standalone",
            "orientation": "portrait",
            "themeColor": "#0a0a0a",
            "backgroundColor": "#0a0a0a",
            "startUrl": "/",
            "iconUrl": "https://app.therapyandsneakers.org/icon-192.png",
            "maskableIconUrl": "https://app.therapyandsneakers.org/icon-192.png",
            "appVersion": "2",
            "appVersionName": "1.0.0.1",
            "signingKey": {
              "path": "/tmp/upload-keystore.jks",
              "alias": "upload-key"
            },
            "features": {
              "playBilling": {
                "enabled": true
              }
            },
            "enableNotifications": false,
            "fallbackType": "customtabs"
          }
          EOF

      - name: Build AAB with Bubblewrap
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          bubblewrap build \
            --skipPwaValidation \
            --manifest twa-manifest.json \
            --signingKeyPassword "$KEYSTORE_PASSWORD" \
            --signingKeyStorePassword "$KEYSTORE_PASSWORD"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ts-muscle-android
          path: |
            app-release-bundle.aab
            app-release.apk
          if-no-files-found: warn
          retention-days: 30
