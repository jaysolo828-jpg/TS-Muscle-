name: Build Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build release AAB
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/signing.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.6-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          printf 'android.useAndroidX=true\nandroid.enableJetifier=true\n' > gradle.properties
          /tmp/gradle-8.6/bin/gradle wrapper --gradle-version 8.6
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ts-muscle-android
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
