[build]
  publish = "."
  command = "npm install"

[functions]
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# sw.js must never be served from CDN cache — browsers need to detect
# the latest version to trigger service worker updates.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

