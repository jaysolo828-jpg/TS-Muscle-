[build]
  publish = "."
  command = "npm install"

[functions]
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# sw.js must never be served from CDN cache — browsers need to detect
# the latest version to trigger service worker updates.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# manifest.json must have correct Content-Type so Chrome accepts it as a PWA manifest.
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "no-cache"

# assetlinks.json must never be cached — stale data breaks TWA full-screen mode.
[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "no-cache"
    Access-Control-Allow-Origin = "*"

