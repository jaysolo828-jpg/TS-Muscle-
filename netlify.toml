[build]
  publish = "."
  command = "npm install"

[functions]
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# sw.js must never be served from CDN cache — browsers need to detect
# the latest version to trigger service worker updates.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# manifest.json must have correct Content-Type so Chrome accepts it as a PWA manifest.
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "no-cache"

# assetlinks.json: long cache so Chrome reuses its DAL verification result
# instead of making a live network request on every cold launch. A live
# request on device wakeup can race with network readiness and fail, causing
# the "disconnected from Play Store" banner. Signing keys rarely change; if
# they do, bump the file and the old cache expires within 7 days anyway.
[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=604800"
    Access-Control-Allow-Origin = "*"

