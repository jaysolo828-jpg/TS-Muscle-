[build]
  publish = "."
  command = "npm install"

[functions]
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# sw.js must never be served from CDN cache — browsers need to detect
# the latest version to trigger service worker updates.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[edge_functions]]
  function = "config"
  path = "/config.js"

[[edge_functions]]
  function = "supabase-config"
  path = "/supabase-config.js"

[[edge_functions]]
  function = "onesignal-config"
  path = "/onesignal-config.js"


[[edge_functions]]
  function = "record-reaction"
  path = "/record-reaction"

[[edge_functions]]
  function = "save-username"
  path = "/save-username"

[[edge_functions]]
  function = "register-player"
  path = "/register-player"

[[edge_functions]]
  function = "get-vapid-key"
  path = "/get-vapid-key"

