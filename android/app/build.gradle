apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'com.google.gms.google-services'

android {
    namespace 'io.github.jaysolo828_jpg.twa'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.jaysolo828_jpg.twa'
        minSdk 23
        targetSdk 35
        versionCode 74
        versionName '1.4.5'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE_PATH') ?: 'keystore.jks')
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias 'my-key-alias'
            keyPassword System.getenv('KEYSTORE_PASSWORD')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
    implementation 'com.google.androidbrowserhelper:billing:1.1.0'
    // Direct Play Billing Library for native bridge (SubscribeActivity).
    // Bypasses Chrome's TWA Play Billing path which hits clientAppUnavailable.
    implementation 'com.android.billingclient:billing-ktx:7.1.1'
    implementation platform('com.google.firebase:firebase-bom:33.1.0')
    implementation 'com.google.firebase:firebase-messaging-ktx'
    implementation 'androidx.health.connect:connect-client:1.1.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
}
